# fail2ban 过滤器：匹配 MCP 端点 (/mcp) 的鉴权失败 (401/403)
# 适用 nginx combined 访问日志格式，例如：
#   192.168.2.236 - - [11/Jul/2026:12:00:00 +0800] "POST /mcp HTTP/1.1" 401 23 "-" "curl/8.0"
#   10.0.0.5 - - [11/Jul/2026:12:00:01 +0800] "POST /mcp HTTP/1.1" 403 23 "-" "Mozilla/5.0"
#
# 说明：
#   - <HOST> 由 fail2ban 自动解析为客户端 IP（即 nginx 记录的 $remote_addr，已是真实客户端 IP）
#   - 仅匹配路径以 /mcp 开头、且 HTTP 状态为 401/403 的请求，避免误伤其它 401
#   - OPTIONS 预检由 nginx 直接返回 204，不会触发本规则

[Definition]
failregex = ^<HOST> - \S+ \[.*?\] "(?:GET|POST|PUT|DELETE|PATCH|HEAD) /mcp[^"]*" (?:401|403) 
ignoreregex =

# datepattern 让 fail2ban 正确解析 nginx 的 [$time_local]，通常无需改
# datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
