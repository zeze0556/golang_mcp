# fail2ban 监狱 (jail) 配置：封禁反复对 /mcp 鉴权失败的 IP
#
# 使用方式：
#   1. 将本文件放到 /etc/fail2ban/jail.d/mcp-auth.conf
#   2. 将 filter.d/mcp-auth.conf 放到 /etc/fail2ban/filter.d/mcp-auth.conf
#   3. 重载： sudo fail2ban-client reload
#
# 注意：
#   - logpath 需与 nginx 实际日志路径一致
#       * 若使用 nginx-mcp.conf 中的专用日志：/var/log/nginx/mcp-access.log
#       * 若用 nginx 主日志：            /var/log/nginx/access.log
#   - 若 nginx 前面还有 CDN / 另一层代理，需启用 nginx real_ip 模块，
#     否则 $remote_addr 会是上一层代理的 IP，导致封错对象。

[mcp-auth]
enabled  = true
filter   = mcp-auth
port     = http,https
# ===== 日志路径（二选一，与你的 nginx 配置对应）=====
logpath  = /var/log/nginx/mcp-access.log
# logpath  = /var/log/nginx/access.log
# =================================================
maxretry = 5            # 在 findtime 窗口内失败 5 次即封禁
findtime = 10m          # 统计窗口：10 分钟
bantime  = 1h           # 封禁时长：1 小时（可按需加长，如 24h / 1d）
backend  = auto
# 默认 action 即为 iptables/nftables 封禁；如需邮件通知可取消下一行注释
# action   = %(action_mwl)s
