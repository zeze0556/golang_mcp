# ============================================
# Nginx 反向代理配置 — Multi-SSH MCP Server
# ============================================
# 将此 server 块加入你的 nginx.conf 或 sites-enabled/
# 适用场景：将 MCP HTTP 服务通过域名安全暴露给外网 / 网页前端
#
# 前置条件：
#   1. 已安装 nginx (with http_v2_module，推荐)
#   2. MCP 服务以 http 模式运行在 127.0.0.1:8080
#   3. 已配置 SSL 证书（生产环境强烈建议 HTTPS）
# ============================================

server {
    listen 80;
    server_name mcp.your-domain.com;

    # 生产环境请改为 listen 443 ssl; 并配置 ssl_certificate / ssl_certificate_key

    # 上传大小限制（写入大文件时需要）
    client_max_body_size 10m;

    location /mcp {
        # 反向代理到本地 MCP 服务
        proxy_pass http://127.0.0.1:8080/mcp;

        # 专用访问日志（便于 fail2ban 隔离读取鉴权失败记录）
        # 格式默认继承全局 combined： $remote_addr - $remote_user [$time_local] "$request" $status ...
        # 如需改用 nginx 主日志，把下面这行注释掉即可（fail2ban 改指 /var/log/nginx/access.log）
        access_log /var/log/nginx/mcp-access.log;

        # 关键：传递真实的 Host 和客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ===== Streamable HTTP 必需 =====
        # 支持 SSE 流式响应（MCP 通过 POST 触发服务端事件推送）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # 关闭缓冲，保证流式响应实时性
        proxy_cache off;
        proxy_read_timeout 3600s;     # 长连接超时（命令可能执行很久）
        proxy_send_timeout 3600s;

        # 传递 MCP Session ID（Streamable HTTP 有状态模式依赖此头）
        proxy_set_header X-Session-Id $http_mcp_session_id;

        # CORS 预检请求（OPTIONS）直接放行
        # 注意：如果 MCP 服务已开启 cors_origins，nginx 也可选择透传
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, Mcp-Session-Id, Accept";
            add_header Content-Length 0;
            return 204;
        }
    }

    # 健康检查端点（可选）
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }
}
