# ============================================
# Multi-SSH MCP Server 配置模板
# ============================================
# 使用方法：复制本文件为 config.yaml 后填入你自己的值
#   cp config.example.yaml config.yaml
# 注意：config.yaml 已加入 .gitignore，不会被提交到代码仓库。

# 传输模式: "stdio" (默认, 适合 Claude Desktop) 或 "http" (适合网页前端 / nginx 反代)
transport: "http"

# HTTP 模式配置（仅当 transport=http 时生效）
http:
  host: "0.0.0.0"          # 监听地址，0.0.0.0 表示所有网卡
  port: 8080               # 监听端口
  path: "/mcp"             # MCP 端点路径，客户端连接 http://host:port/mcp
  # CORS 跨域配置：允许网页前端（如 llama.cpp Web UI）直接调用本服务
  # 通配所有域名：仅写 "*" 即可（自动放行 mcp-protocol-version 等任意自定义头）
  # 公网暴露建议改为精确域名列表，如 ["https://your-frontend.com"]
  cors_origins:
    - "*"
  # 若前端需要携带 Cookie/Authorization 等凭证，保持 true；
  # 纯匿名调用可设为 false。无论 true/false，"*" 都会正确回显来源，浏览器均可接受。
  cors_credentials: true   # 是否允许跨域携带凭证（如 Cookie / Authorization）

  # 关闭 mcp-go 的 localhost/DNS-rebinding Host 校验（默认 false，保持库安全语义）
  # 症状：nginx 反代到 127.0.0.1:8080，但 Host 头透传为外网地址时，
  #       带正确 token 仍报 403 Forbidden: invalid Host header "x.x.x.x"
  # 首选在 nginx 用 proxy_set_header Host localhost; 修正；只有无法改 nginx 时才开此开关。
  # 开启前请确认鉴权/网络层已限制来源（鉴权中间件仍在 Host 校验外层，不受影响）。
  allow_nonlocal_host: false

  # 访问令牌鉴权（防止 MCP 端点被未授权访问，建议公网/反代暴露时务必开启）
  # 客户端调用时需携带：Authorization: Bearer <token>  或  X-Access-Token: <token>
  auth:
    enabled: true
    tokens:
      # 方式 A: 直接写明文令牌（仅适合内网/临时测试，注意别提交到代码仓库）
      # - "请改成一段足够长且随机的令牌，例如 openssl rand -hex 32 生成的"
      # 方式 B: 从环境变量读取，避免明文落盘（推荐）。启动时先 export MCP_ACCESS_TOKEN=xxx
      - "${MCP_ACCESS_TOKEN}"
      # 可配置多个令牌，便于轮换/为不同客户端签发不同令牌

# ============================================
# MCP 工具参数校验配置
# ============================================
# 默认严格模式：拒绝客户端传递工具未声明的参数（如 toolName、@type 等 AI 框架注入的元数据）
tool_validation:
  allow_additional_properties: false  # 设为 true 则放宽校验，允许任意额外参数

# ============================================
# 命令执行安全 / 健壮性配置
# ============================================
command:
  timeout_seconds: 120   # 单条命令最大执行时间（秒），超时即中断远端进程；0 表示不限时（不推荐）
  max_output_mb: 4       # 单条命令 stdout+stderr 采集上限（MB），超出自动截断，防止超大输出撑爆响应

# ============================================
# 本地文件读取控制（read_local_file 工具）
# ============================================
# 出于安全考虑默认关闭；开启后仅允许读取 allowed_dirs 指定目录下的文件，
# 避免被（即便持有 token 的）调用方读取 SSH 私钥、config.yaml 等敏感本地文件。
local_read:
  enabled: false
  allowed_dirs:
    - "C:/Users/YourName/scripts"   # 仅允许读取这些目录（绝对路径）；为空则启用后也不放行任何路径

# ============================================
# 知识库子系统（kb.* 工具：kb.search / kb.fetch / kb.cite / kb.list_scopes）
# ============================================
# enabled=false（默认）时完全不挂载：不注册 KB 工具、不监听目录，MCP 其余能力不受影响。
# 设计契约见 kb-mcp-contract-draft.md；retrieved text 一律视为不可信数据。
knowledge_base:
  enabled: false

  # 向量存储后端: local（默认，零依赖，索引落本地 JSON）或 pgvector（PostgreSQL + pgvector 扩展）
  # 两种后端工具/ACL/写路径完全一致，切换只需改这里（数据不互通，切换后重新消费 watch_dir）
  backend: "local"

  # watch_dir(inbox): 放入待入库文档，服务按 poll_seconds 轮询，按一级子目录划分 scope
  #   例 watch_dir/billing/refund.md -> scope=billing；watch_dir/notes.md -> scope=default
  # write_dir(outbox): 索引文件、失败清单(ingest_failures.log)、去重缓存(kb_ingest_state.json)落这里
  # 硬约束：两者必须是绝对路径、不能相同、不能相互嵌套（防止把产物当新文档自激循环）
  #
  # 启动与缓存：文档扫描/embedding 在后台执行，启动不阻塞；kb_ingest_state.json 记录每个文档的
  # 内容 sha256，未变更的文档跳过 embedding。换 embedding 模型/维度、state 损坏、或索引与 state
  # 不一致时自动全量重建。想强制全量重建：删除 index_file 与 kb_ingest_state.json。
  watch_dir: "D:/knowledge/inbox"
  write_dir: "D:/knowledge/outbox"

  # 索引文件名（相对 write_dir，仅 backend=local 使用）；切换 embedding 模型/维度需删此文件重建索引
  index_file: "kb_index.json"

  # pgvector 后端配置（仅 backend=pgvector 时生效）
  # 向量维度不在此配置：复用上方 embedding.dim（单一真相源，PG 表列 vector(dim) 取同值）
  pgvector:
    dsn: "${KB_PG_DSN}"       # libpq 连接串，支持 ${ENV_VAR}；例如 postgres://u:p@127.0.0.1:5432/kb?sslmode=disable
    table: "kb_chunks"        # 表名，仅允许字母/数字/下划线且不以数字开头
    max_conns: 4              # 连接池上限
    auto_schema: true         # 启动时幂等建扩展/表/索引；设为 false 则要求库已由运维预建

  # 分块与检索参数
  chunk_size: 800          # 每片目标字符数
  chunk_overlap: 100       # 相邻片重叠字符数
  top_k_cap: 20            # top_k 硬上限（最大 20）
  max_char_budget: 12000   # 单次返回字符预算
  poll_seconds: 30         # 后台目录轮询间隔（秒）；0 表示只在启动时后台扫描一次

  # embedding 服务（OpenAI 兼容 /v1/embeddings；模型一旦变更，既有索引失效需全量重建）
  embedding:
    endpoint: "http://192.168.2.236:8082/v1"   # 到 /v1 为止，不要带 /embeddings
    model: "Qwen3-Embedding-0.6B"
    api_key: ""            # 上游无鉴权可留空；支持 ${ENV_VAR}
    dim: 1024
    # 查询侧指令前缀（文档侧不加！指令感知模型只在查询侧加）。用 \n 表示换行。
    query_prefix: "Instruct: 检索知识库文档\nQuery: "
    timeout_seconds: 60

  # 集合级 ACL：token → 可见 scope 列表（与 http.auth.tokens 中的 token 对应）
  # 留空 = open 模式（任何持有合法 token 者可见全部 scope，仅建议内网使用）
  # 配置了映射后：未列出的 token 看不到任何 KB 内容；scope 入参越权项静默丢弃
  token_scopes:
    # - token: "${MCP_ACCESS_TOKEN}"
    #   scopes: ["billing", "hr", "default"]
    # - token: "another-random-token"
    #   scopes: ["hr"]

# known_hosts 文件路径（全局）；为空时回退到 ~/.ssh/known_hosts。
# 仅当所有服务器都未设置 insecure_ignore_host_key 时生效。
known_hosts_path: ""


# ============================================
# 远程服务器清单（支持任意数量）
# ============================================
servers:
  # 场景 1: 使用本地私钥文件
  web-frontend:
    host: "192.168.1.21"        # 改为你的真实服务器 IP 或域名
    port: 22
    user: "root"                # 改为你的 SSH 用户名
    key_path: "C:/Users/YourName/.ssh/id_ed25519"  # 改为你的私钥路径（Windows 用正斜杠）
    # insecure_ignore_host_key: false  # 默认 false=走 known_hosts 校验；设为 true 可跳过主机密钥校验（仅测试/内网，存在中间人风险）
    description: "前端应用服务器，运行 Nginx + Node.js"

  # 场景 2: 直接粘贴私钥内容（适合容器化部署）
  database-master:
    host: "192.168.1.20"
    port: 22
    user: "admin"
    key_content: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      你的私钥内容...
      -----END OPENSSH PRIVATE KEY-----
    description: "主数据库服务器"

  # 场景 3: 本地开发机（Docker 端口映射）
  local-dev:
    host: "127.0.0.1"
    port: 2222
    user: "dev"
    key_path: "C:/Users/YourName/.ssh/test_key"
    description: "本地测试环境"
